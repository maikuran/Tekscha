name: Download and Upload Bedrock Samples

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  download_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Bedrock Samples zip
        run: |
          curl -fL -o bedrock-samples.zip \
            https://github.com/Mojang/bedrock-samples/archive/refs/tags/v1.26.30.5.zip

      - name: Unzip Bedrock Samples
        run: |
          rm -rf bedrock-samples
          unzip -q bedrock-samples.zip -d bedrock-samples
          rm bedrock-samples.zip

      - name: Move extracted files to repository root
        run: |
          rsync -a --delete \
            bedrock-samples/bedrock-samples-1.26.30.5/ \
            ./

          rm -rf bedrock-samples

      - name: Commit and push changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Bedrock Samples"
          git push origin HEAD:main
