name: Download and Upload Bedrock Samples

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  download_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bedrock Samples zip
        run: |
          curl -fL \
            -o bedrock-samples.zip \
            https://github.com/Mojang/bedrock-samples/releases/download/v1.26.30.5/bedrock-samples-v1.26.30.5-min.zip

      - name: Unzip Bedrock Samples
        run: |
          rm -rf bedrock-samples
          mkdir -p bedrock-samples
          unzip -q bedrock-samples.zip -d bedrock-samples
          rm bedrock-samples.zip

      - name: Find extracted files
        run: |
          echo "=== Extracted structure ==="
          find bedrock-samples -maxdepth 3 -print

      - name: Move extracted files to repository root
        run: |
          ROOT=$(find bedrock-samples -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Error: extracted root directory not found."
            exit 1
          fi

          echo "Using extracted directory: $ROOT"

          cp -a "$ROOT"/. .

          rm -rf bedrock-samples

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Bedrock samples v1.26.30.5"
            git push
          fi
