name: Download and Upload Bedrock Samples

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  download_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Bedrock Samples
        shell: bash
        run: |
          set -e

          VERSION="1.26.30.5"
          URL="https://github.com/Mojang/bedrock-samples/archive/refs/tags/v${VERSION}.zip"

          rm -rf "$RUNNER_TEMP/bedrock-samples"
          mkdir -p "$RUNNER_TEMP/bedrock-samples"

          curl -fL --retry 5 --retry-delay 3 \
            -o "$RUNNER_TEMP/bedrock-samples.zip" \
            "$URL"

      - name: Extract Bedrock Samples
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/bedrock-samples/extracted"
          mkdir -p "$RUNNER_TEMP/bedrock-samples/extracted"

          unzip -q \
            "$RUNNER_TEMP/bedrock-samples.zip" \
            -d "$RUNNER_TEMP/bedrock-samples/extracted"

      - name: Copy Bedrock Samples to repository
        shell: bash
        run: |
          set -e

          SOURCE="$RUNNER_TEMP/bedrock-samples/extracted/bedrock-samples-1.26.30.5"

          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: Bedrock Samples directory not found:"
            echo "$SOURCE"
            exit 1
          fi

          echo "Copying Bedrock Samples..."

          cp -a "$SOURCE"/. ./

          echo "Copy completed."

      - name: Clean temporary files
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/bedrock-samples"
          rm -f "$RUNNER_TEMP/bedrock-samples.zip"

      - name: Check changes
        shell: bash
        run: |
          git status --short

      - name: Commit and push to main
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi


          git pull
          git commit -m "Update Bedrock Samples"
          git push
